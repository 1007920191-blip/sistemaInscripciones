<div class="form-container">
  <div class="form-header">
    <h3>{{ esEdicion ? 'EDITAR AULA' : 'NUEVA AULA' }}</h3>
    <button class="btn-cerrar" (click)="onCancelar()">×</button>
  </div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>CÓDIGO *</label>
      <input type="text" [(ngModel)]="aulaForm.codigo" name="codigo" required placeholder="Ej: A1, A2...">
    </div>

    <div class="form-group">
      <label>LOCAL *</label>
      <input type="text" [(ngModel)]="aulaForm.local" name="local" required>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>CAPACIDAD *</label>
        <input type="number" [(ngModel)]="aulaForm.capacidad" name="capacidad" required>
      </div>
      <div class="form-group">
        <label>PABELLÓN *</label>
        <input type="text" [(ngModel)]="aulaForm.pabellon" name="pabellon" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>PISO *</label>
        <input type="number" [(ngModel)]="aulaForm.piso" name="piso" required>
      </div>
      <div class="form-group">
        <label>PUERTA DE ACCESO *</label>
        <input type="text" [(ngModel)]="aulaForm.puertaAcceso" name="puertaAcceso" required>
      </div>
    </div>

    <section class="grados-permitidos" aria-labelledby="grados-permitidos-titulo">
      <div class="grados-permitidos__encabezado">
        <h4 id="grados-permitidos-titulo">GRADOS PERMITIDOS</h4>
        <p>Seleccione los grados y niveles que pueden utilizar esta aula. Si no selecciona ninguno, el aula no será candidata para asignaciones.</p>
      </div>
      <div class="grados-permitidos__niveles">
        <fieldset class="grados-permitidos__nivel" *ngFor="let nivel of niveles">
          <legend>{{ nivel }}</legend>
          <label class="grado-opcion" *ngFor="let grado of gradosPorNivel[nivel]">
            <input type="checkbox" [checked]="gradoPermitidoSeleccionado(nivel, grado)"
              (change)="cambiarGradoPermitido(nivel, grado, $any($event.target).checked)">
            <span>{{ grado }}</span>
          </label>
        </fieldset>
      </div>
    </section>

    <div class="form-actions">
      <button type="button" class="btn-cancelar" (click)="onCancelar()" [disabled]="cargando">Cancelar</button>
      <button type="submit" class="btn-guardar" [disabled]="cargando">{{ cargando ? '⏳ Guardando...' : '💾 Guardar' }}</button>
    </div>
  </form>
</div>
